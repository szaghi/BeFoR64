name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tags are handled by release.yml
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Run tests with coverage
      run: FoBiS.py rule -ex makecoverage

    - name: Extract coverage
      id: cov
      run: |
        PCT=$(gcov -o exe/obj/ src/lib/befor64* 2>/dev/null | \
          awk '/^Lines executed:/{
            match($0, /([0-9.]+)% of ([0-9]+)/, a)
            total += a[2]; covered += a[1]/100 * a[2]
          } END { if (total>0) printf "%.1f", covered/total*100; else print "0.0" }')
        echo "pct=${PCT}" >> "$GITHUB_OUTPUT"
        echo "## Test coverage: ${PCT}%" >> "$GITHUB_STEP_SUMMARY"

